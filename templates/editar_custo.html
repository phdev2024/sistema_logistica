<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Despesa - Logcare Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1">Editar Despesa da Base</h2>
                <span class="text-muted">Ajuste de lançamentos financeiros operacionais</span>
            </div>
            <div>
                <a href="{{ url_for('gerenciar_custos', cd_id=custo.cd_id) }}" class="btn btn-outline-secundaria">← Voltar para Custos</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header card-header-clean">
                <h5>Lançamento: {{ custo.descricao_item }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label class="form-label fw-semibold text-secondary">Mês</label>
                            <input type="month" class="form-control" name="mes_ref" value="{{ custo.mes_referencia }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-semibold text-secondary">Descrição</label>
                            <input type="text" class="form-control" name="descricao" value="{{ custo.descricao_item }}" required>
                        </div>
                        <!-- NOVA CAIXA DE CATEGORIA NA EDIÇÃO -->
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-semibold text-secondary">Categoria (DRE)</label>
                            <select name="categoria" class="form-select" required>
                                <option value="Armazenagem" {% if custo.categoria == 'Armazenagem' %}selected{% endif %}>Armazenagem</option>
                                <option value="Mão de Obra" {% if custo.categoria == 'Mão de Obra' %}selected{% endif %}>Mão de Obra</option>
                                <option value="Movimentação" {% if custo.categoria == 'Movimentação' %}selected{% endif %}>Movimentação</option>
                                <option value="Outros" {% if custo.categoria == 'Outros' %}selected{% endif %}>Outros</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label fw-semibold text-secondary">Tipo</label>
                            <select name="tipo" class="form-select" required>
                                <option value="Fixo" {% if custo.tipo_custo == 'Fixo' %}selected{% endif %}>Fixo</option>
                                <option value="Variável" {% if custo.tipo_custo == 'Variável' %}selected{% endif %}>Variável</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label fw-semibold text-secondary">Valor (R$)</label>
                            <input type="number" step="0.01" class="form-control" name="valor" value="{{ custo.valor }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="{{ url_for('gerenciar_custos', cd_id=custo.cd_id) }}" class="btn btn-outline-secundaria px-4">Cancelar</a>
                        <button type="submit" class="btn btn-empresa px-4">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
