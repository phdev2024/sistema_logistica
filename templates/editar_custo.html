<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Custo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Editar Custo Selecionado</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">Mês de Referência</label>
                            <input type="text" class="form-control" name="mes_ref" value="{{ custo.mes_referencia }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Descrição</label>
                            <input type="text" class="form-control" name="descricao" value="{{ custo.descricao_item }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">Tipo de Custo</label>
                            <select class="form-select" name="tipo">
                                <!-- Lógica para deixar pré-selecionada a opção correta -->
                                <option value="Fixo" {% if custo.tipo_custo == 'Fixo' %}selected{% endif %}>Fixo</option>
                                <option value="Variável" {% if custo.tipo_custo == 'Variável' %}selected{% endif %}>Variável</option>
                                <option value="Mão de Obra" {% if custo.tipo_custo == 'Mão de Obra' %}selected{% endif %}>Mão de Obra</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label fw-bold">Valor (R$)</label>
                            <input type="number" step="0.01" class="form-control" name="valor" value="{{ custo.valor }}" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{{ url_for('gerenciar_custos', cd_id=custo.cd_id) }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary fw-bold">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
