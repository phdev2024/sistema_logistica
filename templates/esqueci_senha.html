<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Recuperar Senha - CheckUpLog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="bg-light d-flex align-items-center" style="min-height: 100vh">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-empresa mb-0">Recuperação de Acesso</h2>
            <span class="text-muted small"
              >Enviaremos um link seguro para o seu e-mail</span
            >
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %} {% if
          messages %} {% for category, message in messages %}
          <div
            class="alert alert-{{ category }} small py-2 text-center shadow-sm"
          >
            {{ message }}
          </div>
          {% endfor %} {% endif %} {% endwith %}

          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <form method="POST">
                <div class="mb-4">
                  <label class="form-label fw-semibold text-secondary small"
                    >E-mail de Cadastro</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-empresa w-100 fw-bold py-2"
                >
                  Receber Link de Recuperação
                </button>
              </form>
            </div>
            <div class="card-footer bg-white border-0 text-center pb-4 pt-0">
              <a
                href="{{ url_for('auth.login') }}"
                class="text-muted small text-decoration-none"
                >Voltar para o Login</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
