<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Editar CD - {{ cd.nome }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow border-warning">
        <div class="card-header bg-warning text-dark">
          <h3 class="mb-0 fw-bold">Editar Base Operacional</h3>
        </div>
        <div class="card-body">
          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-bold">Nome do CD</label>
              <input
                type="text"
                class="form-control"
                name="nome_cd"
                value="{{ cd.nome }}"
                required
              />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Metragem Total (m²)</label>
                <input
                  type="number"
                  step="0.01"
                  class="form-control"
                  name="metragem_m2"
                  value="{{ cd.metragem }}"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Capacidade (Paletes)</label>
                <input
                  type="number"
                  class="form-control"
                  name="capacidade_paletes"
                  value="{{ cd.capacidade_paletes }}"
                />
              </div>
            </div>
            <div class="d-flex justify-content-between mt-3">
              <a href="/cadastro" class="btn btn-secondary">Cancelar</a>
              <button type="submit" class="btn btn-warning fw-bold text-dark">
                Salvar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
