<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Editar Base - Logcare Logística</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold text-dark mb-1">Editar Base Operacional</h2>
          <span class="text-muted"
            >Ajuste de medidas e capacidade física do galpão</span
          >
        </div>
        <a href="/cadastro" class="btn btn-outline-secundaria"
          >← Voltar para Cadastros</a
        >
      </div>

      <div class="card shadow-sm">
        <div class="card-header card-header-clean">
          <h5>Dados da Base: {{ cd.nome }}</h5>
        </div>
        <div class="card-body">
          <form method="POST">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold text-secondary"
                  >Nome do CD</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="nome_cd"
                  value="{{ cd.nome }}"
                  required
                />
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label fw-semibold text-secondary"
                  >Metragem Total (m²)</label
                >
                <input
                  type="number"
                  step="0.1"
                  class="form-control"
                  name="metragem_m2"
                  value="{{ cd.metragem }}"
                />
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label fw-semibold text-secondary"
                  >Capacidade (Paletes)</label
                >
                <input
                  type="number"
                  class="form-control"
                  name="capacidade_paletes"
                  value="{{ cd.capacidade_paletes }}"
                />
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
              <a href="/cadastro" class="btn btn-outline-secundaria px-4"
                >Cancelar</a
              >
              <button type="submit" class="btn btn-empresa px-4">
                Salvar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
