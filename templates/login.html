<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Seguro - CheckUpLog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f4f6f9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .card-login {
        width: 100%;
        max-width: 400px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="card card-login p-4">
      <h4 class="text-center mb-1 text-primary fw-bold">CheckUpLog</h4>
      <p class="text-center text-muted small mb-4">Gestão Estratégica de CDs</p>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div
        class="alert alert-{{ category }} alert-dismissible fade show py-2"
        role="alert"
      >
        <small>{{ message }}</small>
        <button
          type="button"
          class="btn-close py-2"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="seu.email@empresa.com"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input
            type="password"
            name="senha"
            class="form-control"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
      </form>
    </div>
  </body>
</html>
