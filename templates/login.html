<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Login - CheckUpLog SaaS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="bg-light d-flex align-items-center" style="min-height: 100vh">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="text-center mb-4">
            <h1 class="fw-bold text-empresa mb-0">CheckUpLog</h1>
            <span
              class="text-muted text-uppercase"
              style="letter-spacing: 2px; font-size: 0.8rem"
              >Gestão Estratégica de CDs</span
            >
          </div>

          <!-- CAIXA DE MENSAGENS -->
          {% with messages = get_flashed_messages(with_categories=true) %} {% if
          messages %} {% for category, message in messages %}
          <div
            class="alert alert-{{ 'success' if category == 'success' else 'danger' if category == 'error' else category }} small py-2 text-center shadow-sm"
          >
            {{ message }}
          </div>
          {% endfor %} {% endif %} {% endwith %}

          <!-- CAIXA BRANCA PRINCIPAL -->
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <form method="POST">
                <div class="mb-3">
                  <label class="form-label fw-semibold text-secondary small"
                    >E-mail</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold text-secondary small"
                    >Senha</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    name="senha"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-empresa w-100 fw-bold py-2"
                >
                  Acessar Painel
                </button>
              </form>
            </div>

            <!-- O RODAPÉ AGORA ESTÁ BEM GUARDADO DENTRO DA CAIXA -->
            <div class="card-footer bg-white border-0 text-center pb-4 pt-0">
              <span class="text-muted small">Ainda não tem acesso?</span>
              <a
                href="{{ url_for('registrar_conta') }}"
                class="text-empresa fw-bold small text-decoration-none"
                >Crie sua conta agora</a
              >
            </div>
          </div>
          <!-- FIM DA CAIXA BRANCA -->
        </div>
      </div>
    </div>
  </body>
</html>
