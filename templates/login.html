<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Seguro - CheckUpLog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="login-wrapper">
    <div class="card card-login p-4">
      <div class="text-center mb-4">
        <h3 class="brand-title mb-1">CheckUpLog</h3>
        <span class="brand-subtitle">Gestão Estratégica de CDs</span>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div
        class="alert alert-{{ category }} alert-dismissible fade show py-2"
        role="alert"
      >
        <small class="fw-semibold">{{ message }}</small>
        <button
          type="button"
          class="btn-close py-2"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold">E-mail</label>
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="admin@checkuplog.com"
            required
            autocomplete="email"
          />
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary small fw-bold">Senha</label>
          <input
            type="password"
            name="senha"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn btn-empresa w-100 py-2">
          Acessar Painel
        </button>
      </form>
    </div>
  </body>
</html>
