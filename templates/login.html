<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Seguro - CheckUpLog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      body {
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .card-login {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e9ecef;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }
      .brand-title {
        color: #212529;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-subtitle {
        color: #6c757d;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .form-control {
        border-radius: 8px;
        padding: 0.65rem 0.9rem;
        border: 1px solid #ced4da;
      }
      .form-control:focus {
        border-color: #00b894;
        box-shadow: 0 0 0 0.2rem rgba(0, 184, 148, 0.25);
      }
      .btn-entrar {
        background-color: #212529;
        border-color: #212529;
        color: #ffffff;
        font-weight: 600;
        padding: 0.7rem;
        border-radius: 8px;
        transition: all 0.2s ease-in-out;
      }
      .btn-entrar:hover {
        background-color: #00b894;
        border-color: #00b894;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card card-login p-4">
      <div class="text-center mb-4">
        <h3 class="brand-title mb-1">CheckUpLog</h3>
        <span class="brand-subtitle">Gestão Estratégica de CDs</span>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div
        class="alert alert-{{ category }} alert-dismissible fade show py-2"
        role="alert"
      >
        <small class="fw-semibold">{{ message }}</small>
        <button
          type="button"
          class="btn-close py-2"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold">E-mail</label>
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="admin@checkuplog.com"
            required
            autocomplete="email"
          />
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary small fw-bold">Senha</label>
          <input
            type="password"
            name="senha"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn btn-entrar w-100">
          Acessar Painel
        </button>
      </form>
    </div>
  </body>
</html>
